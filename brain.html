<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Zones During Change</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Bai Jamjuree',sans-serif;background:#fff;color:#000;padding:16px 20px;line-height:1.45;max-width:100%;margin:0 auto}

.layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.brain-col{flex:1 1 280px;min-width:250px}
.info-col{flex:1 1 300px;min-width:260px}

.stage{position:relative;background:#f7f7f5;border:1px solid #ecedea;border-radius:10px;padding:6px}
.stage img{display:block;width:100%;height:auto}

.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  border:2px solid #0A3D4F;background:rgba(255,255,255,.92);color:#0A3D4F;
  font-family:inherit;font-size:13px;font-weight:700;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:background .18s,color .18s,box-shadow .18s,transform .12s;
  animation:pulse 2.4s infinite}
.pin:hover{transform:translate(-50%,-50%) scale(1.12);background:#80EAFF;animation:none}
.pin:focus-visible{outline:3px solid #50D0ED;outline-offset:2px}
.pin.active{background:#0A3D4F;color:#80EAFF;border-color:#0A3D4F;animation:none;
  box-shadow:0 0 0 9px rgba(128,234,255,.5)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(80,208,237,.6)}70%{box-shadow:0 0 0 10px rgba(80,208,237,0)}100%{box-shadow:0 0 0 0 rgba(80,208,237,0)}}

.hint{font-size:11px;color:#999;margin-top:6px;text-align:center}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-family:inherit;font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;border:1px solid #ecedea;
  background:#f7f7f5;color:#555;cursor:pointer;transition:.18s;white-space:nowrap}
.chip:hover{border-color:#80EAFF}
.chip.active{background:linear-gradient(135deg,#80EAFF,#50D0ED);border-color:#50D0ED;color:#0A3D4F}

.panel{background:#f7f7f5;border-left:4px solid #80EAFF;border-radius:0 10px 10px 0;padding:14px 16px;min-height:250px}
.panel h2{font-size:20px;font-weight:700;line-height:1.15}
.panel .sub{font-size:13px;font-weight:600;color:#3AAFC7;margin-bottom:10px}
.row{margin-top:10px}
.label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#999}
.row p{font-size:15px;font-weight:500;margin-top:2px}
.row.consequence{background:#fff;border:1px solid #ecedea;border-radius:8px;padding:10px 12px;margin-top:12px}
.empty{color:#999;font-size:15px;font-weight:500;display:flex;align-items:center;min-height:220px}
</style>
</head>

</div>

<script>
var ZONES = {
  amygdala:{n:1,x:36,y:55,name:"Amygdala",nick:"The Threat Detector",
    role:"The survival centre — a 24/7 alarm system.",
    biz:"You announce a \"new CRM\" → it reads a threat → stress hormones flood the body within 200 ms.",
    con:"Logic is bypassed. People can't hear rational explanations in survival mode."},
  entorhinal:{n:2,x:43,y:64,name:"Entorhinal Cortex",nick:"The Internal GPS",
    role:"Builds mental maps of space — and of social hierarchies.",
    biz:"Reorg erases those maps: no one knows where they stand or who decides what.",
    con:"Rebuilding social maps drains energy — people feel exhausted after restructuring, even doing the same work."},
  basal:{n:3,x:41,y:32,name:"Basal Ganglia",nick:"The Habit Factory",
    role:"Stores automatic behaviour. Habits run on autopilot, using minimal energy.",
    biz:"Change forces manual mode — the brain can't reuse stored habits. It feels exhausting.",
    con:"New processes feel \"wrong\" because they cost more energy. When pressure drops, people snap back."},
  habenula:{n:4,x:57,y:34,name:"Habenula",nick:"The Anti-Reward Center",
    role:"Cuts motivation after failure — protection against repeated letdowns.",
    biz:"If past change failed or mistakes were punished, it remembers and blocks enthusiasm.",
    con:"Learned helplessness: \"Why bother? It'll fail like last time.\" Apathy sets in."}
};
var ORDER=["amygdala","entorhinal","basal","habenula"];
var stage=document.getElementById('stage'),chipsEl=document.getElementById('chips'),panelEl=document.getElementById('panel');

ORDER.forEach(function(k){
  var z=ZONES[k];

  var p=document.createElement('button');
  p.className='pin';p.type='button';p.dataset.zone=k;p.textContent=z.n;
  p.style.left=z.x+'%';p.style.top=z.y+'%';
  p.setAttribute('aria-label',z.name);
  p.addEventListener('click',function(){select(k);});
  stage.appendChild(p);

  var c=document.createElement('button');
  c.className='chip';c.type='button';c.dataset.zone=k;
  c.textContent=z.n+'. '+z.name;
  c.addEventListener('click',function(){select(k);});
  chipsEl.appendChild(c);
});

function select(k){
  var z=ZONES[k];
  panelEl.innerHTML='<h2>'+z.name+'</h2><div class="sub">'+z.nick+'</div>'+
    '<div class="row"><div class="label">Role</div><p>'+z.role+'</p></div>'+
    '<div class="row"><div class="label">In business</div><p>'+z.biz+'</p></div>'+
    '<div class="row consequence"><div class="label">Consequence</div><p>'+z.con+'</p></div>';
  document.querySelectorAll('.pin,.chip').forEach(function(el){
    el.classList.toggle('active',el.dataset.zone===k);
  });
}
</script>
