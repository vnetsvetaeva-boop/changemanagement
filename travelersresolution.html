<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adapt Support — Leading Through Change</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Bai Jamjuree',Arial,sans-serif;background:#fff;color:#000;padding:20px 28px;line-height:1.5;max-width:100%;margin:0 auto;overflow-x:hidden}
button{font-family:inherit}
button:focus{outline:none}
button:focus-visible{outline:3px solid #0A3D4F;outline-offset:3px}

/* Intro */
.title{font-size:28px;font-weight:700;color:#111;line-height:1.25}
.intro{font-size:18px;font-weight:500;margin-top:6px}
.intro em{font-style:normal;font-weight:700}
.note{margin-top:12px;background:#f7f7f5;border-left:4px solid #80EAFF;border-radius:0 10px 10px 0;padding:10px 16px;font-size:16px;font-weight:500;color:#333}
.note strong{color:#0A3D4F}

/* Layout */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:stretch}

/* Matrix (from the base screen) */
.matrix{
  display:grid;
  grid-template-columns:26px 42px 1fr 1fr;
  grid-template-rows:auto auto 1fr 1fr;
  grid-template-areas:
    ".  .   ax   ax"
    ".  .   ch1  ch2"
    "ay rh1 c0   c1"
    "ay rh2 c2   c3";
  gap:10px;
  min-width:0;
}
.axis-x{grid-area:ax;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#0A3D4F}
.axis-y{grid-area:ay;display:flex;align-items:center;justify-content:center}
.axis-y span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#0A3D4F;white-space:nowrap}
.col-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#767676;text-align:center;align-self:end}
.row-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#767676;display:flex;align-items:center;justify-content:flex-end}

.cell{position:relative;font-family:inherit;background:#f4f4f3;border:2px solid #ecedea;border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;transition:.18s;min-width:0}
.cell:hover{border-color:var(--a)}
.cell.active{background:var(--a);border-color:var(--a)}
.fig{height:104px;display:flex;align-items:flex-end}
.fig img{max-height:104px;width:auto;display:block}
.cname{font-size:18px;font-weight:700;color:#0A3D4F}
.cell.active .cname{color:#fff}
.cell.active .fig img{filter:brightness(0) invert(1)}
.seen{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:#10B981;color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.seen svg{width:11px;height:11px}
.cell.is-seen .seen{opacity:1}
.cell.active .seen{opacity:0}

/* Panel */
.panel{background:#f7f7f5;border-left:4px solid #ecedea;border-radius:0 10px 10px 0;padding:18px 22px;display:flex;flex-direction:column;min-width:0;transition:background .18s,border-color .18s}
.panel:focus{outline:none}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.empty p{font-size:18px;font-weight:500;color:#767676}
.empty ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.empty li{display:flex;gap:10px;align-items:center;font-size:14px;color:#555}
.empty li b{flex:0 0 auto;width:10px;height:10px;border-radius:50%}
.pname{font-size:28px;font-weight:700;color:#111;line-height:1.2}
.meta{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.meta .dot{opacity:.5;margin:0 6px}
.blabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#6b6b6b;margin-top:14px;display:flex;align-items:center;gap:6px}
.blabel svg{width:14px;height:14px}
.behavior{font-size:18px;font-weight:500;margin-top:2px}
.next{margin-top:14px;background:#fff;border:2px solid var(--a);border-radius:10px;padding:14px 16px}
.next .blabel{margin-top:0;color:var(--x)}
.next p{font-size:18px;font-weight:600;color:#111;margin-top:4px}
.next small{display:block;font-size:14px;color:#6b6b6b;margin-top:8px}
.pnav{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-size:14px;color:#6b6b6b}
.btn{font-size:16px;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer;border:2px solid #0A3D4F;background:#0A3D4F;color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#0E5168;border-color:#0E5168}
.btn svg{width:16px;height:16px}

/* Bottom reminder */
.foot{margin-top:20px;display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#80EAFF,#50D0ED);border-radius:12px;padding:14px 20px}
.foot svg{flex:0 0 22px;width:22px;height:22px;color:#0A3D4F}
.foot p{font-size:16px;font-weight:500;color:#0A3D4F}
.foot strong{font-weight:700}

/* Fill the whole iframe height on desktop/tablet landscape */
@media (min-width:861px){
  .wrap{min-height:calc(100vh - 40px)}
  .cell{justify-content:center}
  .fig{height:clamp(104px, calc((100vh - 260px) / 2), 260px)}
  .fig img{max-height:100%;height:100%}
  .cname{font-size:clamp(18px, 2.6vh, 28px)}
  .pname{font-size:clamp(28px, 4.2vh, 44px)}
  .meta{font-size:clamp(14px, 1.7vh, 18px)}
  .blabel{font-size:clamp(11px, 1.4vh, 14px);margin-top:clamp(14px, 2.6vh, 28px)}
  .blabel svg{width:clamp(14px,1.8vh,18px);height:clamp(14px,1.8vh,18px)}
  .behavior{font-size:clamp(18px, 2.6vh, 26px)}
  .next{margin-top:clamp(14px, 2.6vh, 28px);padding:clamp(14px, 2.4vh, 26px) clamp(16px, 2.4vh, 28px)}
  .next p{font-size:clamp(18px, 2.6vh, 26px)}
  .panel{padding:clamp(18px, 3.4vh, 40px) clamp(22px, 3vh, 40px)}
  .count{font-size:clamp(14px, 1.7vh, 17px)}
  .btn{font-size:clamp(16px, 2vh, 20px);padding:clamp(10px,1.6vh,16px) clamp(18px,2.4vh,26px)}
  .empty p{font-size:clamp(18px, 2.6vh, 26px)}
  .axis-x,.axis-y span,.col-h,.row-h{font-size:clamp(11px, 1.4vh, 14px)}
}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .panel{min-height:200px}
}
@media (max-width:520px){
  body{padding:16px}
  .title{font-size:24px}
  .intro{font-size:16px}
  .matrix{grid-template-columns:22px 34px 1fr 1fr;gap:8px}
  .cell{padding:10px 8px}
  .fig{height:80px}
  .fig img{max-height:80px}
  .cname{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

     a:'#50D0ED', t:'#EAFAFE', x:'#0E6F87'}
  ];
  var ORDER = [1,0,3,2]; // Runner → Walker → Trudger → Resister
  var cells = document.querySelectorAll('.cell');
  var panel = document.getElementById('panel');
  var seen = [];
  var eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var flask = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>';
  var arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';

  function save(cur){ try{ localStorage.setItem(KEY, JSON.stringify({cur:cur, seen:seen})); }catch(e){} }

  function select(id, moveFocus){
    if(seen.indexOf(id) < 0) seen.push(id);
    cells.forEach(function(x){
      var on = +x.dataset.id === id;
      x.classList.toggle('active', on);
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
      x.classList.toggle('is-seen', seen.indexOf(+x.dataset.id) > -1);
    });
    var d = D[id];
    var nextId = ORDER[(ORDER.indexOf(id) + 1) % 4];
    panel.style.background = d.t;
    panel.style.borderLeftColor = d.a;
    panel.style.setProperty('--a', d.a);
    panel.style.setProperty('--x', d.x);
    panel.innerHTML =
      '<div class="pname">' + d.n + '</div>' +
      '<div class="meta" style="color:' + d.x + '">Chose it: ' + d.c + '<span class="dot">&middot;</span>Wants it: ' + d.w + '</div>' +
      '<div class="blabel">' + eye + 'Current position and response</div>' +
      '<div class="behavior">' + d.n + ' — ' + d.d.charAt(0).toLowerCase() + d.d.slice(1) + '</div>' +
      '<div class="next"><div class="blabel">' + flask + 'Possible next step to test</div><p>' + d.s + '</p>' +
      '</div>' +
      '<div class="pnav"><span class="count">' + (seen.length === 4 ? 'You have reviewed all four positions.' : 'Reviewed ' + seen.length + ' of 4') + '</span>' +
      '<button type="button" class="btn" id="nextPos">Next: ' + D[nextId].n + arrow + '</button></div>';
    document.getElementById('nextPos').addEventListener('click', function(){
      select(nextId, false);
      document.querySelector('.cell[data-id="' + nextId + '"]').focus();
    });
    save(id);
    if(moveFocus) panel.focus();
  }

  cells.forEach(function(c){
    c.addEventListener('click', function(){ select(+c.dataset.id, false); });
  });

  try{
    var s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(s && Array.isArray(s.seen)) seen = s.seen.filter(function(n){ return n >= 0 && n < 4; });
    if(s && typeof s.cur === 'number' && s.cur >= 0 && s.cur < 4) select(s.cur, false);
  }catch(e){}
})();
</script>
</body>
</html>
