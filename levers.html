<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Practical Levers</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:'Bai Jamjuree',Arial,sans-serif;background:#fff;color:#000;padding:20px 28px;line-height:1.5;max-width:100%;margin:0 auto;overflow-x:hidden}
button,textarea{font-family:inherit}
button:focus,textarea:focus{outline:none}
button:focus-visible{outline:3px solid #0A3D4F;outline-offset:3px}

.app{min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:14px}


.lead{background:#f7f7f5;border-left:4px solid #80EAFF;border-radius:0 10px 10px 0;padding:clamp(10px,1.8vh,16px) 18px;font-size:clamp(18px,2.4vh,22px);font-weight:600;color:#0A3D4F}

/* Lever cards 3 + 2 */
.levers{flex:1 1 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:auto auto;align-content:stretch;gap:12px}
.lever{position:relative;grid-column:span 2;background:#f4f4f3;border:2px solid #ecedea;border-radius:12px;transition:border-color .18s,background .18s,box-shadow .18s;min-width:0;display:flex;flex-direction:column}
.lever:nth-child(4),.lever:nth-child(5){grid-column:span 3}
.lever:hover{border-color:var(--a)}
.lever-h{flex:1 1 auto;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,14px);background:none;border:0;padding:clamp(16px,3vh,28px) clamp(18px,2.4vw,30px);cursor:pointer;text-align:center;border-radius:10px}
.lever.open .lever-h{flex:0 0 auto;justify-content:flex-start;flex-direction:row;align-items:center;text-align:left;padding-bottom:clamp(8px,1.4vh,14px)}
.ico{flex:0 0 auto;width:clamp(44px,7vh,64px);height:clamp(44px,7vh,64px);border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--x);border:1px solid #ecedea}
.ico svg{width:55%;height:55%}
.lever.open .ico{width:clamp(40px,5.6vh,52px);height:clamp(40px,5.6vh,52px)}
.lever-h .tx{min-width:0}
.lever-h .nm{display:block;font-size:clamp(18px,3vh,28px);font-weight:700;color:#0A3D4F;line-height:1.2}
.lever-h .sh{display:block;font-size:clamp(14px,2vh,18px);color:#555;line-height:1.35;margin-top:2px}
.lever-h .chev{position:absolute;top:clamp(14px,2.4vh,22px);right:clamp(14px,2vw,22px);width:20px;height:20px;color:#767676;transition:transform .2s}
.lever.open{background:var(--t);border-color:var(--a);box-shadow:0 4px 14px rgba(10,61,79,.10)}
.lever.open .ico{background:var(--a);color:var(--on);border-color:var(--a)}
.lever.open .chev{transform:rotate(90deg)}
.lever-b{padding:0 clamp(18px,2.4vw,30px) clamp(16px,3vh,28px);display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px)}
.def{font-size:clamp(16px,2.3vh,21px);font-weight:700;color:#111;line-height:1.35}
.row .k{display:block;font-size:clamp(11px,1.4vh,13px);font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--x);margin-bottom:2px}
.row p{font-size:clamp(15px,2vh,18px);color:#222}
.note{font-size:clamp(14px,1.8vh,16px);background:#fff;border-left:3px solid var(--a);border-radius:0 8px 8px 0;padding:8px 12px;color:#333}




@media (max-width:900px){
  .levers{grid-template-columns:1fr 1fr;grid-template-rows:none}
  .lever,.lever:nth-child(4){grid-column:span 1}
  .lever:nth-child(5){grid-column:span 2}
  .lever.open{grid-column:1 / -1}
}
@media (max-width:560px){
  body{padding:16px}
  .levers{grid-template-columns:1fr;grid-template-rows:none}
  .lever,.lever:nth-child(4),.lever:nth-child(5){grid-column:span 1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (max-width:560px){.lead{font-size:16px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-clarity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9.5" width="7" height="5" rx="1"/><path d="M9 9.5 15 6v12l-6-3.5"/><path d="M18.5 8l2.5-1.5"/><path d="M19 12h3"/><path d="M18.5 16l2.5 1.5"/></symbol>
  <symbol id="i-influence" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="9" cy="6" r="2.2" fill="currentColor"/><circle cx="16" cy="12" r="2.2" fill="currentColor"/><circle cx="7" cy="18" r="2.2" fill="currentColor"/></symbol>
  <symbol id="i-capability" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h5v-5h5v-5h5V5h3"/></symbol>
  <symbol id="i-capacity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 11v2"/><path d="M10 11v2"/></symbol>
  <symbol id="i-escalation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="m5 11 7-7 7 7"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-arrow-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-arrow-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<div class="app">
  <p class="lead">Choose the lever based on the confirmed barrier—not the person’s position or personality.</p>
  <div class="levers" id="levers"></div>
</div>

<script>
(function(){
  'use strict';
  var KEY = 'ltc-five-levers-cards-v1';
  var L = [
    {id:'clarity', n:'Clarity', sh:'Make the next step clear', a:'#50D0ED', t:'#EAFAFE', x:'#0E6F87', on:'#0A3D4F',
     def:'Make expectations and the next step easier to understand.',
     use:'Roles, priorities, decisions, timelines, or responsibilities remain unclear.',
     act:'Clarify what is changing, what will remain stable, what is expected now, and when more information will be available.'},
    {id:'influence', n:'Influence', sh:'Give people a real say', a:'#9580FF', t:'#F1EEFF', x:'#4B36C2', on:'#fff',
     def:'Give people meaningful input into how the change is implemented.',
     use:'The direction is fixed, but the person has little sense of choice or control.',
     act:'Offer choices about sequencing, workflow, responsibilities, testing, or local implementation.',
     note:'Influence does not mean reopening every decision. Be clear about what can and cannot still be shaped.'},
    {id:'capability', n:'Capability', sh:'Build skill and confidence', a:'#D8FF57', t:'#F7FFDD', x:'#4D6600', on:'#0A3D4F',
     def:'Build the skills and confidence required to use the new approach.',
     use:'The person understands what to do but cannot yet do it confidently or consistently.',
     act:'Provide practice, coaching, job aids, demonstrations, feedback, or peer support.'},
    {id:'capacity', n:'Capacity', sh:'Make time and space', a:'#7C93A1', t:'#EEF2F4', x:'#3E5563', on:'#fff',
     def:'Create enough time and mental space for the new behavior.',
     use:'Workload, competing priorities, or change fatigue prevents action.',
     act:'Remove, delay, simplify, or reprioritize work; protect practice time; temporarily adjust expectations.'},
    {id:'escalation', n:'Escalation', sh:'Raise what you cannot solve', a:'#0A3D4F', t:'#E7EEF1', x:'#0A3D4F', on:'#fff',
     def:'Raise a barrier that cannot be resolved at the manager’s level.',
     use:'Progress depends on policy, system configuration, resources, authority, or a leadership decision.',
     act:'Document the evidence, identify the required decision, assign an owner, and communicate when the next update will be provided.'}
  ];
  function $(s){ return document.querySelector(s); }
  function vars(d){ return '--a:'+d.a+';--t:'+d.t+';--x:'+d.x+';--on:'+d.on; }
  var open = null;
  try{ open = localStorage.getItem(KEY); }catch(e){}

  $('#levers').innerHTML = L.map(function(d){
    return '<div class="lever" id="lv-'+d.id+'" style="'+vars(d)+'">'+
      '<button type="button" class="lever-h" aria-expanded="false" aria-controls="lb-'+d.id+'" data-id="'+d.id+'">'+
        '<span class="ico" aria-hidden="true"><svg><use href="#i-'+d.id+'"/></svg></span>'+
        '<span class="tx"><span class="nm">'+d.n+'</span><span class="sh">'+d.sh+'</span></span>'+
        '<svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></button>'+
      '<div class="lever-b" id="lb-'+d.id+'" hidden>'+
        '<p class="def">'+d.def+'</p>'+
        '<div class="row"><span class="k">Use when</span><p>'+d.use+'</p></div>'+
        '<div class="row"><span class="k">Possible actions</span><p>'+d.act+'</p></div>'+
        (d.note ? '<p class="note">'+d.note+'</p>' : '')+
      '</div></div>';
  }).join('');

  function render(){
    L.forEach(function(d){
      var on = open === d.id;
      $('#lv-'+d.id).classList.toggle('open', on);
      $('#lv-'+d.id+' .lever-h').setAttribute('aria-expanded', on ? 'true' : 'false');
      $('#lb-'+d.id).hidden = !on;
    });
    try{ open ? localStorage.setItem(KEY, open) : localStorage.removeItem(KEY); }catch(e){}
  }
  $('#levers').addEventListener('click', function(e){
    var h = e.target.closest('.lever-h'); if(!h) return;
    open = (open === h.dataset.id) ? null : h.dataset.id; render();
  });
  if(!L.some(function(d){ return d.id === open; })) open = null;
  render();
})();
</script>
</body>
</html>
